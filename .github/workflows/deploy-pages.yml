name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        working-directory: app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci 2>/dev/null || npm install
          npm run build

      - name: Copy lessons into dist
        run: |
          mkdir -p app/dist/data
          cp data/lessons.json app/dist/data/lessons.json
          if [ -d app/public/audio ] && [ "$(ls -A app/public/audio 2>/dev/null)" ]; then
            cp -r app/public/audio app/dist/audio || true
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
